services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: fief
      POSTGRES_DB: fief
      POSTGRES_PASSWORD: fiefpassword
    volumes:
      - postgres18-data:/var/lib/postgresql/
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    image: redis:8.10.3-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres18-data:
