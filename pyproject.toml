[tool.mypy]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "furl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jwcrypto.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.logging.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "postmarker.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sendgrid.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dramatiq.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymysql.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pycountry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "wtforms.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy_utils.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["posthog.*", "user_agents.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "python_http_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "attr.*"  # Imported by rich in .hatch/fief-server/lib/python3.11/site-packages/rich/pretty.py:31
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "TRY", "UP"]
ignore = ["E501"]
per-file-ignores = {"conftest.py" = ["E731"], "tests/*" = ["TRY"], "fief/repositories/*" = ["E711", "E712"], "fief/alembic/*" = ["F401"]}

[tool.coverage.run]
concurrency = ["thread", "gevent"]
omit = ["fief/alembic/*"]

[tool.pytest.ini_options]
addopts = "-n auto --cov fief/ --cov-report=term-missing"
markers = ["test_data", "access_token", "authenticated_admin", "htmx"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.hatch]

[tool.hatch.build]
include = [
  "/fief/**/*.py",
  "/fief/py.typed",
  "/fief/alembic.ini",
  "/fief/locale",
  "/fief/static",
  "/fief/templates",
  "/fief/services/email_template/templates",
]
artifacts = [
  "/fief/static/**/*.js",
  "/fief/static/**/*.css",
  "/fief/locale/**/*.mo",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "regex_commit"
commit_extra_args = ["-e"]
path = "fief/__init__.py"

[tool.hatch.envs.default]
installer = "uv"
python = "3.14"
dependency-groups = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
test-cov-xml = "pytest --cov fief/ --cov-report=xml --exitfirst"

lint = [
  "ruff format .",
  "ruff check --fix .",
  "mypy fief/",
]
lint-check = [
  "ruff format --check .",
  "ruff check .",
  "mypy fief/",
]

"translations.add" = [
  "mkdir -p fief/locale/{args}/LC_MESSAGES",
  "touch fief/locale/{args}/LC_MESSAGES/messages.po",
  "hatch run translations.update",
]
"translations.update" = [
  "pybabel extract --mapping babel.cfg --output-file=fief/locale/messages.pot .",
  "pybabel update --domain=messages --input-file=fief/locale/messages.pot --output-dir=fief/locale",
]
"translations.compile" = [
  "pybabel compile --domain=messages --directory=fief/locale",
]

"static.build" = "npm run build"

"migrations.create" = [
  "docker compose up -d db",
  "env GENERATE_MIGRATION=1 alembic -c fief/alembic.ini revision --autogenerate -m {args}",
]
"migrations.migrate" = [
  "docker compose up -d db",
  "env GENERATE_MIGRATION=1 alembic -c fief/alembic.ini upgrade head",
]

"telemetry.set-posthog-key" = [
  "sed -i.bak 's/__POSTHOG_API_KEY__/{args}/' fief/services/posthog.py",
  "rm fief/services/posthog.py.bak"
]

"dev.env.start" = "docker compose up -d"
"dev.env.stop" = "docker compose stop"
"dev.server.start" = [
  "hatch run translations.compile",
  "hatch run static.build",
  "uvicorn --host 0.0.0.0 --port 8000 fief.app:app"
]
"dev.server.watch" = "watchfiles --ignore-paths fief/static,fief/locale 'hatch run dev.server.start' fief js styles"
"dev.worker.start" = "dramatiq fief.worker -p 1 -t 1 -f fief.scheduler:schedule"
"dev.worker.watch" = "watchfiles --ignore-paths fief/static,fief/locale 'hatch run dev.worker.start' fief"

[build-system]
requires = ["hatchling", "hatch-regex-commit"]
build-backend = "hatchling.build"

[project]
name = "fief-server"
authors = [
  { name = "François Voron", email = "contact@fief.dev" }
]
description = "Users and authentication management SaaS"
readme = "README.md"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiomysql==0.3.2",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "apscheduler==3.11.3",
    "argon2_cffi==25.1.0",
    "asgi-babel==0.11.0",
    "asyncpg==0.32.0",
    "dramatiq[redis]==2.2.1",
    "email_validator==2.3.0",
    "fastapi==0.162.0",
    "fief-client==0.20.0",
    "furl==2.1.4",
    "httpx==0.27.2",
    "httpx-oauth==0.17.0",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "jwcrypto==1.6.1",
    "loguru==0.7.3",
    "phonenumbers==9.0.42",
    "posthog==7.79.0",
    "postmarker==1.0",
    "pydantic==2.14.1",
    "python-multipart==0.0.32",
    "pydantic-settings==2.16.2",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "pyotp==2.10.0",
    "redis==8.1.0",
    "segno==1.6.6",
    "sendgrid==6.12.5",
    "psycopg[binary]==3.3.6",
    "pycountry==26.2.16",
    "python-slugify==9.1.3",
    "pytz==2026.5",
    "rich==15.0.0",
    "sentry-sdk==2.73.0",
    "sqlalchemy[asyncio]==2.1.6",
    "sqlalchemy-utils==0.43.0",
    "typer==0.27.3",
    "user-agents==2.2.0",
    "uvicorn[standard]==0.54.0",
    "webauthn==3.0.1",
    "WTForms==3.3.1",
    "zxcvbn-rs-py==0.3.0",
]

[project.scripts]
fief = "fief.cli.__main__:app"

[project.urls]
Documentation = "https://docs.fief.dev"
Source = "https://github.com/opensensor/fief"

[dependency-groups]
dev = [
    "asgi-lifespan",
    "beautifulsoup4",
    "coverage[toml]",
    "fakeredis>=2.20",
    "gevent",
    "httpx",
    "libcst",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-asyncio>=1.4.1,<2",
    "pytest-mock",
    "pytest-xdist",
    "respx",
    "ruff",
    "types-python-slugify",
    "types-pytz",
    "pip-audit>=2.10.1,<3",
    "build",
    "hatchling",
    "hatch-regex-commit",
]

# Process supervisor shipped only in the container image.
docker = ["supervisor==4.3.0"]
